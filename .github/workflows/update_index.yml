name: Update planos_index.json

on:
  push:
    paths:
      - "Planos de Estudos/**"
      - "Planos de Aula/**"
      - "Objetivos de Avaliação/**"
      - "planos_index.json"
      - "update_index_v2_2.py"         # <-- trocado
      - ".github/workflows/update_index.yml"
  pull_request:
    paths:
      - "Planos de Estudos/**"
      - "Planos de Aula/**"
      - "Objetivos de Avaliação/**"
      - "planos_index.json"
      - "update_index_v2_2.py"         # <-- trocado
      - ".github/workflows/update_index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Git LFS pull (just in case)
        run: |
          git lfs install || true
          git lfs fetch --all || true
          git lfs checkout || true

      - name: Show repo debug info
        run: |
          echo "PWD: $(pwd)"
          echo "Branch:"
          git rev-parse --abbrev-ref HEAD
          echo "First 200 files:"
          git ls-files | head -n 200
          echo "Git-tracked file count:"
          git ls-files | wc -l

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Audit and auto-update index (FS scan)
        run: |
          python update_index_v2_2.py --root . --index planos_index.json --report-dir artifacts --scan-fs-only --auto-map-smart --use-similarity-fallback --prefer-folder "Planos de Estudos" --auto-demote-canonical --auto-add-extras --write --allow-unresolved

      - name: Upload audit report and file list
        uses: actions/upload-artifact@v4
        with:
          name: planos-index-report
          path: |
            artifacts/update_index_report.json
            artifacts/update_index_report.md
            artifacts/file_list.txt

      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(index): audit & auto-update planos_index.json"
          file_pattern: planos_index.json artifacts/*
